name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install python-semantic-release build
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: io.github.MFApplications.RCSyncitMF.flatpak
          manifest-path: io.github.MFApplications.RCSyncitMF.yml
          cache-key: flatpak-builder-${{ github.sha }}
      - run: |
          mkdir -p dist
          mv io.github.MFApplications.RCSyncitMF.flatpak dist/ 2>/dev/null || true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - run: semantic-release version
      - run: semantic-release publish