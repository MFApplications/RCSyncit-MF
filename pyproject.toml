[project]
name = "rcsyncitmf"
version = "0.1.0"
description = "GNOME-style multi-config rclone manager"
requires-python = ">=3.11"
dependencies = ["PyGObject>=3.46", "tomli-w>=1.0"]

[project.optional-dependencies]
dev = ["mypy>=1.10", "ruff>=0.6", "pytest>=8"]

[project.scripts]
rcsyncitmf = "rcsyncitmf.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["rcsyncitmf*"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = false
files = ["src/rcsyncitmf"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/rcsyncitmf/**/*.py" = ["E402"]
"src/rcsyncitmf/ui/**/*.py" = ["E501"]
